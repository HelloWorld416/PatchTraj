# dataset
dataset_type: 'JRDB'
model_name: patchformer
scene_names: None
obs_len: 9
pred_len: 12
num_epoch: 101 # 101
batchsize: 16  # 64
num_sample: 20
data_scale: 1
padding: 'LastFrame'
# Patchization trajectory
patch_size: 2
stride: 2
patch_list: [3, 9]
patch_stride_mode: nonoverlap
dynamic_patch: True
num_experts: 2
fusion_mode: bidirectional
# optimizer
lr: 1e-3
weight_decay: 1e-4
decay_step: 8  # 10
decay_gamma: 0.5
#milestone: [25, 50, 75, 100]
# hyper parameter for training
hyper_param1: 5
hyper_param2: 1
freq_recon_lambda: 1.0
# initialize the transformer para
num_layers: 4
num_heads: 4
latent_dims: 256
patch_embed: 256
dropout: 0.1
# other settings
ema: False
n_pre: 9  # keep the same length as obs_len
