# dataset
dataset_type: 'NBA'
model_name: patchformer
scene_names: None
obs_len: 10
pred_len: 20
num_epoch: 51
batchsize: 32
num_sample: 20
data_scale: 5
padding: 'LastFrame'
# Patchization trajectory
patch_size: 2
stride: 2
patch_list: [2, 5, 10]  # [1, 2, 5]
patch_stride_mode: nonoverlap
dynamic_patch: True
num_experts: 4
fusion_mode: bidirectional
# optimizer
lr: 1e-3
weight_decay: 1e-4
decay_step: 8
decay_gamma: 0.5
#milestone: [25, 50, 75, 100]
# hyper parameter for training
hyper_param1: 2
hyper_param2: 1
freq_recon_lambda: 1.0
# initialize the transformer para
num_layers: 2
num_heads: 2
latent_dims: 128
patch_embed: 128
dropout: 0.1
# other settings
ema: False
n_pre: 10
